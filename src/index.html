<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Generator</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f9;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    #quote-text {
      font-size: 1.2rem;
      font-style: italic;
      color: #333;
    }

    #author-text {
      margin-top: 10px;
      font-weight: bold;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="card">
    <p id="quote-text">"Click the button to get inspired."</p>
    <p id="author-text">- The Internet</p>
    <button id="generate-btn">Get New Quote</button>
  </div>

  <script>

    const generateBtn = document.getElementById("generate-btn")

    const quoteHist = [];

    const authorText = document.getElementById("author-text");
    const quoteText = document.getElementById("quote-text");
    generateBtn.addEventListener("click", async () => {
      await fetchquote();
    });

    const fetchquote = async () => {
      try {
        quoteText.innerText = `Loading`;

        authorText.innerText = ``;
        const res = await fetch("https://dummyjson.com/quotes/random");
        const data = await res.json();


        quoteText.innerText = `${data.quote}`;
        authorText.innerText = `${data.author}`;


        quoteHist.push(data.quote);


      } catch (error) {
        console.log("Error try again");
      }
      if (quoteHist.length % 5 === 0) {
        console.log("History:", quoteHist);
      }
    };

    fetchquote();
  </script>
</body>

</html>
